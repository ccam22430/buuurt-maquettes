<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUUURT — Recherche de maquettes</title><style>body{font:15px Arial,sans-serif;margin:0;color:#222;background:#f5f5f6}header{background:#fff;padding:15px 22px;border-bottom:1px solid #ddd}h1{font-size:21px;margin:0 0 6px}.layout{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 80px)}aside{background:white;padding:15px;overflow:auto}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aaa;border-radius:8px;font-size:15px}button{display:block;width:100%;text-align:left;background:white;border:1px solid transparent;border-radius:8px;padding:10px;margin:4px 0;cursor:pointer}button:hover,button.active{background:#ffe2ec;border-color:#e90062}button b{display:block;color:#bc0050}main{min-width:0}iframe{width:100%;height:100%;border:0}small{color:#666}#count{margin:10px 0;color:#555}@media(max-width:720px){.layout{display:block;height:auto}aside{max-height:280px}iframe{height:850px}}</style></head><body><header><h1>BUUURT — Bibliothèque visuelle</h1><small>Recherche instantanée par code français ou anglais · 20 écrans</small></header><div class="layout"><aside><label for="search">Rechercher un code</label><input id="search" type="search" placeholder="HAB, HAB-CAI, 003, USR…" autocomplete="off"><div id="count" role="status"></div><div id="results"></div></aside><main><iframe id="preview" title="Bibliothèque visuelle BUUURT"></iframe></main></div><script>const pages=[{"fr":"HAB-SIT-001","en":"USR-WEB-001","title":"HAB-SIT-001 — Accueil BUUURT.nl"},{"fr":"HAB-MAN-001","en":"USR-SEL-001","title":"HAB-MAN-001 — Choix des quartiers"},{"fr":"HAB-MAN-002","en":"USR-SEL-002","title":"HAB-MAN-002 — Confirmation et sauvegarde"},{"fr":"HAB-AUT-001","en":"USR-AUT-001","title":"HAB-AUT-001 — Connexion / création de compte"},{"fr":"HAB-MAN-003","en":"USR-SEL-003","title":"HAB-MAN-003 — Fil des quartiers choisis"},{"fr":"HAB-RUE-001","en":"USR-STR-001","title":"HAB-RUE-001 — Fil après QR code de rue"},{"fr":"HAB-VIT-001","en":"USR-STO-001","title":"HAB-VIT-001 — Fil après QR vitrine"},{"fr":"HAB-CAI-001","en":"USR-POS-001","title":"HAB-CAI-001 — Annonces du commerce — caisse"},{"fr":"HAB-LOC-001","en":"USR-LOC-001","title":"HAB-LOC-001 — Fil Autour de moi"},{"fr":"HAB-LOC-002","en":"USR-LOC-002","title":"HAB-LOC-002 — Aucune annonce locale"},{"fr":"HAB-DIR-001","en":"USR-DIR-001","title":"HAB-DIR-001 — Entrée directe sans contexte"},{"fr":"HAB-FAV-001","en":"USR-FAV-001","title":"HAB-FAV-001 — Favoris habitant"},{"fr":"COM-001","en":"MER-001","title":"COM-001 — Accès commerçant"},{"fr":"COM-002","en":"MER-002","title":"COM-002 — Profil du commerce"},{"fr":"COM-003","en":"MER-003","title":"COM-003 — Tableau de bord commerçant"},{"fr":"COM-004","en":"MER-004","title":"COM-004 — Créer / modifier une annonce"},{"fr":"COM-005","en":"MER-005","title":"COM-005 — Choix gratuit ou sponsorisé"},{"fr":"COM-006","en":"MER-006","title":"COM-006 — Configuration sponsorisation"},{"fr":"COM-007","en":"MER-007","title":"COM-007 — Gestion et corbeille"},{"fr":"COM-008","en":"MER-008","title":"COM-008 — Partage de l’annonce"}];const search=document.getElementById('search'),results=document.getElementById('results'),count=document.getElementById('count'),preview=document.getElementById('preview');let active=location.hash.slice(1)||pages[0].en;function select(p){active=p.en;location.hash=p.en;preview.src='BUUURT_Bibliotheque_Visuelle_20_Ecrans_Menu_NL.html#'+encodeURIComponent(p.en);render()}function render(){const q=search.value.trim().toUpperCase();const found=pages.filter(p=>(p.fr+' '+p.en).toUpperCase().includes(q));count.textContent=found.length+' écran(s) trouvé(s)';results.replaceChildren();for(const p of found){const b=document.createElement('button');b.className=p.en===active?'active':'';const code=document.createElement('b');code.textContent=p.fr+' · '+p.en;const desc=document.createElement('span');desc.textContent=p.title.split(' — ').slice(1).join(' — ');b.append(code,desc);b.onclick=()=>select(p);results.append(b)}if(!found.length)results.textContent='Aucun écran correspondant.'}search.addEventListener('input',render);window.addEventListener('hashchange',()=>{const p=pages.find(p=>p.en===location.hash.slice(1)||p.fr===location.hash.slice(1));if(p&&p.en!==active)select(p)});select(pages.find(p=>p.en===active||p.fr===active)||pages[0]);</script></body></html>
