<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUUURT · Revue des raccords d’Amsterdam</title>
<link rel="stylesheet" href="leaflet.css">
<style>
body { margin: 0; color: #19171c; font: 16px system-ui; }
header, footer { padding: 12px 16px; }
h1 { font-size: 1.35rem; margin: 0 0 4px; }
p { margin: 4px 0; }
#map { height: 69vh; min-height: 320px; background: #f7f6f7; }
</style>
<header>
<h1>Raccords d’Amstelveen et de Diemen</h1>
<p>Carte de vérification. Les contacts proposés sont provisoires.</p>
</header>
<div id="map" aria-label="Carte de contrôle des raccords"></div>
<footer>
<a href="https://data.overheid.nl/dataset/5l2csm77flzgya">Ville d’Amsterdam · CC0 1.0</a> ·
<a href="https://data.overheid.nl/dataset/83996-cbs-gebiedsindelingen-1995---2015">CBS et Kadaster · 2009 · CC BY 4.0</a> ·
<a href="https://data.overheid.nl/dataset/81148-bestand-bodemgebruik-2010">CBS Bestand Bodemgebruik 2010 · CC BY 4.0</a>
</footer>
<script src="leaflet.js"></script>
<script>
const layers = {
  "Amsterdam 2009": ["Amsterdam municipal · 2009", "#32333d", .10],
  "CBS 2009 originals": ["Amstelveen et Diemen · originaux CBS 2009", "#5b51a5", 0, "6 5"],
  "Review remainder": ["Communes après retrait des chevauchements", "#da2360", .26],
  "2010 water": ["Eau · CBS été 2010", "#3b91bc", .23],
  "Original overlap": ["Chevauchements d’origine", "#8b38b2", .55],
  "Unassigned CBS Amsterdam": ["Écarts sans territoire attribué", "#b36111", .50],
  "Provisional contact": ["Segments à vérifier", "#16161b", 0, "3 5"]
};
const map = L.map("map", {attributionControl: false}).setView([52.35, 4.9], 11);
async function show() {
  const response = await fetch("review.geojson");
  if (!response.ok) throw new Error("Le GeoJSON de revue est indisponible.");
  const {features} = await response.json();
  const overlays = {};
  for (const [kind, [title, color, fillOpacity, dashArray]] of Object.entries(layers)) {
    overlays[title] = L.geoJSON(features.filter(feature => feature.properties.kind === kind), {
      style: {color, fillOpacity, dashArray, weight: kind === "Provisional contact" ? 4 : 2},
      onEachFeature: (feature, layer) => {
        const label = document.createElement("span");
        label.textContent = feature.properties.name;
        layer.bindTooltip(label);
      }
    }).addTo(map);
  }
  L.control.layers(null, overlays, {collapsed: window.matchMedia("(max-width: 600px)").matches}).addTo(map);
  const dolores = [52.36395892, 4.86340111];
  L.circleMarker(dolores, {radius: 6, color: "#126c39", fillOpacity: 1})
    .bindTooltip("Dolores Del Dia Vintage & Modern").addTo(map);
  const bounds = overlays[layers["Review remainder"][0]].getBounds().extend(dolores);
  map.fitBounds(bounds, {padding: [16, 16]});
}
show().catch(error => {
  console.error(error.stack);
  document.querySelector("header p").textContent = error.message;
});
</script>
