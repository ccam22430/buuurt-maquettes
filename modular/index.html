<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUUURT — Bibliothèque visuelle (20 écrans)</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#222;background:#f5f5f6}header{background:#fff;border-bottom:1px solid #ddd;padding:16px 22px}h1{font-size:23px;margin:0 0 6px}header p{margin:0;color:#555;font-size:14px}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 85px)}aside{background:white;border-right:1px solid #ddd;max-height:calc(100vh - 85px);overflow:auto;padding:14px}aside button{display:block;text-align:left;width:100%;padding:11px;margin:3px 0;border:1px solid transparent;border-radius:8px;background:white;cursor:pointer;font-size:13px;color:#333}aside button:hover{background:#fff1f6}aside button.active{background:#ffe2ec;border-color:#e90062}aside button b{display:block;color:#bc0050;margin-bottom:3px}main{padding:18px;min-width:0}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.toolbar strong{font-size:17px}.toolbar small{display:block;color:#666;margin-top:3px}.actions button{background:#fff;border:1px solid #ccc;border-radius:8px;padding:9px 14px;cursor:pointer}.actions button:hover{border-color:#f00066}iframe{display:block;width:100%;height:900px;border:1px solid #ddd;border-radius:14px;background:#f4f4f6}.notice{font-size:13px;color:#666;margin-top:10px}@media(max-width:720px){.layout{display:block}aside{max-height:220px;border-right:0;border-bottom:1px solid #ddd}main{padding:10px}iframe{height:850px}header{padding:12px}}
</style></head><body><header><h1>BUUURT — Bibliothèque visuelle</h1><p>20 maquettes consultables · 20 novembre 2026 · Documents de travail non validés</p></header><div class="layout"><aside id="nav" aria-label="Choisir un écran"></aside><main><div class="toolbar"><div><strong id="screenTitle"></strong><small id="screenCodes"></small></div><div class="actions"><label for="uiLanguage">Langue / Taal / Language </label><select id="uiLanguage" aria-label="Langue des maquettes"><option value="nl" selected>Nederlands</option><option value="fr">Français</option><option value="en">English</option></select> <button id="prev">← Précédent</button> <button id="next">Suivant →</button></div></div><iframe id="preview" title="Aperçu de la maquette" sandbox="allow-same-origin"></iframe><p class="notice">Aperçu du prototype HTML existant. Les visuels et contenus ne constituent pas une validation graphique. Les codes français et anglais désignent le même écran.</p></main></div><script type="module">
import { composeScreen } from './components/compose.mjs';
import { codes, screenMarkup } from './components/render.mjs';

async function loadJson(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error('Chargement impossible : ' + path);
  return response.json();
}

async function initialize(){
const [components, sources] = await Promise.all([
  loadJson('components/shared.json'),
  Promise.all(codes.map(code => loadJson('screens/' + code + '.json')))
]);
const pages = sources.map(page => ({ ...page, html: composeScreen(page.html, components) }));


let currentLanguage = 'nl';
let selected = 0;
const nav = document.getElementById('nav');
const preview = document.getElementById('preview');
const language = document.getElementById('uiLanguage');
let arrivalDraft;

function setLanguage(value) {
  currentLanguage = value;
  language.value = value;
  show(selected);
}

language.addEventListener('change', () => {
  saveArrivalDraft(preview.contentDocument);
  setLanguage(language.value);
});

function arrivalFields(doc) {
  const choice = doc?.querySelector('.arrival input[name="arrival-lang"]:checked');
  return choice ? doc.querySelector('.arrival .copy.' + choice.id.slice(1)) : null;
}

function saveArrivalDraft(doc) {
  const fields = doc?.querySelector('.arrival .copy.' + currentLanguage);
  if (!fields) return;
  arrivalDraft = {
    email: fields.querySelector('input[type="email"]').value,
    consent: fields.querySelector('input[type="checkbox"]').checked
  };
}

const byCode = new Map(pages.flatMap((page, index) => [[page.en, index], [page.fr, index]]));

function show(index) {
  const next = (index + pages.length) % pages.length;
  if (next !== selected) arrivalDraft = undefined;
  selected = next;
  const page = pages[selected];
  document.getElementById('screenTitle').textContent = page.title;
  document.getElementById('screenCodes').textContent = page.en + ' · ' + page.fr + ' · ' + (selected + 1) + '/' + pages.length;
  preview.srcdoc = screenMarkup(page, currentLanguage);
  for (const [position, button] of [...nav.children].entries()) {
    button.classList.toggle('active', position === selected);
    button.setAttribute('aria-current', position === selected ? 'page' : 'false');
  }
  if (location.hash !== '#' + page.en) location.hash = page.en;
}

for (const [index, page] of pages.entries()) {
  const button = document.createElement('button');
  const codes = document.createElement('b');
  codes.textContent = page.en + ' · ' + page.fr;
  button.append(codes, page.title.replace(/^[^—]*—\s*/, ''));
  button.onclick = () => show(index);
  nav.appendChild(button);
}

preview.addEventListener('load', () => {
  const doc = preview.contentDocument;
  const phone = doc?.querySelector('.phone');
  if (phone) phone.style.maxWidth = '100%';
  const fields = arrivalFields(doc);
  if (fields && arrivalDraft) {
    fields.querySelector('input[type="email"]').value = arrivalDraft.email;
    fields.querySelector('input[type="checkbox"]').checked = arrivalDraft.consent;
  }
  doc?.addEventListener('change', event => {
    const choice = event.target;
    if (choice.name === 'arrival-lang' && ['lfr', 'lnl', 'len'].includes(choice.id)) {
      saveArrivalDraft(doc);
      setLanguage(choice.id.slice(1));
    }
  });
  doc?.addEventListener('click', event => {
    const href = event.target.closest('a[href]')?.getAttribute('href');
    if (!href?.endsWith('.html')) return;
    const index = byCode.get(href.slice(0, -5));
    if (index === undefined) return;
    event.preventDefault();
    show(index);
  });
});
document.getElementById('prev').onclick = () => show(selected - 1);
document.getElementById('next').onclick = () => show(selected + 1);
window.addEventListener('hashchange', () => {
  const index = byCode.get(location.hash.slice(1));
  if (index !== undefined && index !== selected) show(index);
});
show(byCode.get(location.hash.slice(1)) ?? 0);
}

initialize().catch(error => {
  const alert = document.createElement('p');
  alert.setAttribute('role', 'alert');
  alert.textContent = 'Chargement de la bibliothèque impossible. ' + error.message;
  document.body.appendChild(alert);
  console.error(error);
});
</script></body></html>
