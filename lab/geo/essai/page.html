<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; connect-src 'none'">
<title>BUUURT — GEO-06</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4f5;color:#261b22;font:16px/1.45 Nunito,system-ui,sans-serif}
header,main{max-width:960px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}
header strong{font-size:28px;letter-spacing:-1.4px}main{display:grid;gap:16px}section,details{background:white;padding:20px;border-radius:18px;border:1px solid #e8dde3}h1,h2,p{margin:0 0 12px}h1{font-size:26px}h2{font-size:19px}.note{background:#fce9f0;color:#69112f;padding:12px 16px;border-radius:12px}
label,button,select{font:inherit}label{display:block}label:has(input[type=checkbox]){display:flex;align-items:center;gap:8px;min-height:40px}
select,button,input[type=text],input[type=number],textarea{padding:9px 12px;border-radius:10px;background:#fff;border:1px solid #ad9ca6;color:inherit;max-width:100%}
button{cursor:pointer;font-weight:700}button.primary{background:#a90042;border-color:#a90042;color:white}
button:disabled{cursor:default;opacity:.55}input[type=checkbox]{width:18px;height:18px;accent-color:#98224b}textarea{width:100%;min-height:72px}
small{display:block;color:#55434c;margin-top:8px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}svg{display:block;width:100%;height:auto;border:1px solid #e3dadf;border-radius:14px;background:#f8fbfc}
svg path{stroke:#fff;stroke-width:2}svg path[role=button]{cursor:pointer}svg path:focus-visible{outline:none;stroke:#4b2141;stroke-width:4}.districts{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:2px 10px}.legend{display:flex;flex-wrap:wrap;gap:10px;margin:9px 0}
.legend span{padding:2px 8px;border-radius:6px;font-size:13px}.green{background:#a7d7a9}.yellow{background:#f1cf5a}.gray{background:#d5d8da}
summary{cursor:pointer;font-weight:700}.fields{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.fields label>*{display:block;margin-top:4px}
#listing{white-space:pre-wrap}output{display:block;margin-top:8px}footer{font-size:13px;color:#53404a}[hidden]{display:none!important}
</style>
</head>
<body>
<header><strong>BUUURT</strong><label><span data-key="language"></span> <select id="lang"><option>NL</option><option>EN</option><option>FR</option></select></label></header>
<main>
<div class="note" data-key="banner"></div>
<details id="settings" open>
<summary data-key="settings"></summary>
<div class="fields">
<label><span data-key="profile"></span><select id="profile"><option value="amsterdam">Amsterdam</option><option value="graft">Graft</option></select></label>
<label><span data-key="capacityMode"></span><select id="capacityMode"><option value="normal" data-key="normal"></option><option value="low" data-key="low"></option><option value="missing" data-key="missing"></option></select></label>
</div>
<label><input type="checkbox" id="enabled"><span data-key="enabled"></span></label>
<label><input type="checkbox" id="revoked"><span data-key="revoke"></span></label>
<p id="running"></p>
</details>
<section>
<h1 data-key="publication"></h1>
<p id="address"></p>
<label><span data-key="draft"></span><textarea id="draft"></textarea></label>
<p id="draftStatus" role="status"></p>
</section>
<section id="choice">
<h2 data-key="choice"></h2>
<div class="buttons"><button id="free" data-key="free"></button><button id="sponsored" class="primary" data-key="sponsored"></button></div>
</section>
<section id="preview" hidden>
<h2 data-key="preview"></h2>
<p id="listing"></p>
<div class="buttons"><button id="confirmFree" class="primary" data-key="confirmFree"></button><button id="freeBack" data-key="back"></button></div>
<output id="freeResult" aria-live="polite"></output>
</section>
<section id="campaign" hidden>
<h2 data-key="sponsored"></h2>
<div class="fields">
<label><span data-key="package"></span><select id="package"></select></label>
<label><span data-key="duration"></span><input type="number" id="duration" min="1" max="30" step="1"></label>
</div>
<div class="legend"><span class="green" data-key="home"></span><span class="yellow" data-key="eligible"></span><span class="gray" data-key="blocked"></span></div>
<svg id="map" viewBox="0 0 640 410" role="group"></svg>
<div id="districts" class="districts"></div>
<p id="revocation" role="status"></p>
<output id="capacity" aria-live="polite"></output>
<div class="buttons"><button id="confirmSponsored" class="primary" data-key="confirmSponsored"></button><button id="back" data-key="back"></button></div>
<output id="sponsoredResult" aria-live="polite"></output>
</section>
<footer data-key="source"></footer>
</main>
<script>
const MAPS = /*__CBS__*/;
/*__BENCH__*/
</script>
</body>
</html>
