/* BUUURT CARD LAYOUT V2 — mandatory responsive announcement-card contract.
   The image goes ABOVE copy on phone-sized cards, not in a narrow side rail.
   Image retains its crop; badge stays on media and never overlaps sponsored copy.
   Applied to all .nearby cards in any screen loading this shared stylesheet. */
.nearby{min-width:0;max-width:100%;overflow:hidden}
.nearby>.open{display:flex;flex-direction:column;align-items:stretch;gap:0;min-width:0;width:100%;padding:0!important;text-align:left}
.nearby .picture{position:relative;display:block;flex:none;width:100%;height:auto!important;min-height:0!important;aspect-ratio:16/9;overflow:hidden;background:#eee8ec}
.nearby .picture img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;border-radius:0!important}
.nearby .picture>.tag{position:absolute;top:10px;left:10px;right:auto;max-width:calc(100% - 70px);width:max-content;display:inline-flex;align-items:center;flex-wrap:nowrap;gap:5px;white-space:nowrap;overflow-wrap:normal;word-break:normal;font-size:clamp(11px,2.8vw,14px);line-height:1.2;padding:5px 9px;border-radius:999px}
.nearby .picture>.tag>span{white-space:nowrap;overflow-wrap:normal;word-break:normal}
.nearby .copy{min-width:0;width:100%;padding:12px 14px 8px;overflow-wrap:break-word}
.nearby .copy>.sponsored{display:inline-block;position:static;margin-bottom:5px;max-width:100%;white-space:normal}
.nearby .copy>strong,.nearby .copy .post-message{display:block;min-width:0;max-width:100%}
.nearby .heart{position:absolute;top:10px;right:10px;left:auto;z-index:2}
.nearby .card-pager{width:100%;max-width:100%;margin:0;padding:0 0 3px;justify-content:center}
.nearby .shop-posts-link{margin:0 12px 10px auto}

const cardPhotoIndex=new Map();
const cardPhotos=post=>[post.src,...(extraCardPhotos[post.id]||[])];
const photoLabel={fr:"Photo",nl:"Foto",en:"Photo"}[locale];
function postTag(type){
 const kinds=["offer","event","new"];
 const symbols=["percent","event","star"];
 return '<span class="tag tag-'+kinds[type]+'">'+icon(symbols[type])+'<span>'+t[8+type]+'</span></span>';
}
function markup(post,feature,showShopLink=true){
 const saved=isSaved(post.id);
 const categoryTag=postTag(post.type);
 const gallery=feature?[post.src]:cardPhotos(post);
 const current=feature?0:(cardPhotoIndex.get(post.id)||0);
 const image='<div class="picture"'+(gallery.length>1?' data-card-gallery="'+post.id+'"':'')+'><img src="'+gallery[current]+'" alt="" draggable="false">'+categoryTag+'</div>';
 const pager=gallery.length>1?'<div class="card-pager" aria-label="'+photoLabel+'">'+gallery.map((_,i)=>'<button type="button" data-card-photo="'+i+'" aria-label="'+photoLabel+' '+(i+1)+' / '+gallery.length+'" aria-current="'+(i===current)+'"></button>').join("")+'</div>':"";
 const sponsor=!feature&&post.id===3;
 const sponsorTag=sponsor?'<small class="sponsored">'+t[20]+'</small>':'';
 const discount=sponsor?'<span class="offer-discount">'+(locale==="fr"?"−20 %":"−20%")+'</span>':'';
 const street=post.street?'<span class="post-street" title="'+post.street+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18l-2-6H5l-2 6Zm2 0v10h14V10M9 20v-7h6v7M3 10c0 3 4 3 5 0 1 3 7 3 8 0 1 3 5 3 5 0"/></svg><span>'+post.street+'</span></span>':'';
 const distance=post.distance==null?"":'<span class="distance" title="'+(aroundMe?aroundLabels[2]:t[21])+'">'+icon("walk")+'<span>'+post.distance+' m</span></span>';
 const locationLine='<span class="post-location">'+street+distance+'</span>';
 const text='<div class="copy">'+sponsorTag+'<strong>'+post.shop+'</strong>'+(feature?'<small>'+t[30]+'</small>':'')+'<div class="post-message"><h3>'+post.title+'</h3><p>'+discount+post.body+'</p></div>'+(feature?'<span class="cta">'+offerActions[locale][post.type]+' →</span>':'')+locationLine+'</div>';
 return '<article class="'+(feature?"feature":"nearby")+'"><button class="open" data-open="'+post.id+'" type="button">'+image+text+'</button><button class="heart" type="button" data-heart="'+post.id+'" aria-pressed="'+saved+'" aria-label="'+t[saved?15:14]+'">'+icon("heart")+'</button>'+pager+(!feature&&showShopLink&&post.id>=3?'<a class="shop-posts-link" href="#commerce-'+post.id+'" aria-label="'+t[23]+' · '+post.shop+'">'+t[23]+'</a>':'')+'</article>';
}
const track=q("#track");
const dots=q("#dots");
function renderScannedShop(){
 const matches=data.slice(0,3).filter(post=>category===-1||post.type===category);
 track.innerHTML=matches.map(post=>markup(post,true)).join("");
 dots.replaceChildren();
 matches.forEach((post,i)=>{
  const button=document.createElement("button");
  button.type="button";button.setAttribute("aria-label",post.title);
  button.onclick=()=>track.scrollTo({left:track.children[i].offsetLeft-track.children[0].offsetLeft,behavior:"smooth"});
  dots.append(button);
 });
 q("#scanned-shop").hidden=aroundMe||matches.length===0;
 if(!matches.length&&!aroundMe){q("#scanned-shop").hidden=false;track.innerHTML="<p>"+({nl:"Geen berichten van deze winkel in deze categorie.",en:"No posts from this shop in this category.",fr:"Aucune annonce de ce commerce dans cette catégorie."}[locale])+"</p>";}
}
renderScannedShop();
function activeDot(){
 const offsets=[...track.children].map(card=>Math.abs(card.offsetLeft-track.children[0].offsetLeft-track.scrollLeft));
 const current=offsets.indexOf(Math.min(...offsets));
 [...dots.children].forEach((button,i)=>button.setAttribute("aria-current",String(i===current)));
}
track.addEventListener("scroll",activeDot,{passive:true});
let startX;
track.addEventListener("pointerdown",event=>{startX=event.clientX});
track.addEventListener("pointerup",event=>{if(Math.abs(event.clientX-startX)>12)suppressClickUntil=performance.now()+300});
activeDot();
function renderFeed(){
 const entries=data.slice(3).filter(post=>(category===-1||post.type===category)&&(!aroundMe||post.distance<=nearbyRadius))
  .sort((a,b)=>sort==="recent"?b.publishedAt-a.publishedAt:a.distance-b.distance);
 q("#feed").innerHTML=entries.length?entries.map(post=>markup(post,false)).join(""):"<p>"+t[19]+"</p>";
}
function categoryTab(type){
 return icon(["grid","offer","event","news"][type+1])+"<span>"+t[5+type]+"</span>";
}
for(let i=-1;i<3;i++){
 const button=document.createElement("button");
 button.innerHTML=categoryTab(i);button.type="button";button.setAttribute("aria-pressed",String(i===-1));
 button.onclick=()=>{category=i;for(const tab of q("#categories").children)tab.setAttribute("aria-pressed",String(tab===button));renderScannedShop();renderFeed()};
 q("#categories").append(button);
}
q("#sort").onchange=event=>{sort=event.target.value;q("#sort-value").textContent=sort==="recent"?byDate:byDistance;renderFeed()};

const favoriteLabels={
 fr:["Mes annonces favorites","Retour au fil","Aucun favori pour l’instant.","Aucun favori dans cette catégorie.","Explorer les annonces","Voir des favoris d’exemple","1 annonce enregistrée"," annonces enregistrées","Exemples de favoris"],
 nl:["Mijn favorieten","Terug naar het overzicht","Je hebt nog geen favorieten.","Geen favorieten in deze categorie.","Bekijk berichten","Bekijk voorbeeldfavorieten","1 opgeslagen bericht"," opgeslagen berichten","Voorbeeldfavorieten"],
 en:["My favorites","Back to the feed","You haven’t saved any posts yet.","No favorites in this category.","Explore posts","See example favorites","1 saved post"," saved posts","Example favorites"]
};
const fav=favoriteLabels[locale];
const favoriteLink=q("#favorites-link");
favoriteLink.innerHTML=icon("heart");
favoriteLink.setAttribute("aria-label",fav[0]);
favoriteLink.title=fav[0];
let favoriteCategory=-1;
function renderFavorites(){
 const panel=q("#favorites-page");
 const ids=[...new Set([...favorites,...(examples?exampleFavorites.filter(id=>!removedExamples.has(id)):[])])];
 const posts=ids.slice().reverse().map(id=>data[id]).filter(Boolean);
 const visible=posts.filter(post=>favoriteCategory===-1||post.type===favoriteCategory);
 const count=posts.length;
 const summary=count===1?fav[6]:count+fav[7];
 const filters=count?'<div class="categories favorite-filters">'+[-1,0,1,2].map(type=>'<button type="button" data-fav-category="'+type+'" aria-pressed="'+(type===favoriteCategory)+'">'+categoryTab(type)+'</button>').join("")+'</div>':"";
 panel.innerHTML='<a href="#" class="detail-back">← '+fav[1]+'</a><h1 id="favorites-title" tabindex="-1">'+fav[0]+'</h1><p class="fav-summary">'+(examples?fav[8]+" · ":"")+summary+'</p>'+filters+(visible.length?visible.map(post=>markup(post,false)).join(""):'<div class="favorites-empty"><p>'+fav[count?3:2]+'</p>'+(count?"":'<a href="#">'+fav[4]+'</a>'+(examples?"":'<button id="favorite-examples" type="button">'+fav[5]+'</button>'))+'</div>');
 for(const button of panel.querySelectorAll("[data-fav-category]"))button.onclick=()=>{
  favoriteCategory=Number(button.dataset.favCategory);
  renderFavorites();
  panel.querySelector('[data-fav-category="'+favoriteCategory+'"]').focus();
 };
 const exampleButton=panel.querySelector("#favorite-examples");
 if(exampleButton)exampleButton.onclick=()=>{
  const url=new URL(location.href);
  url.searchParams.set("examples","1");
  location.href=url;
 };
 for(const button of panel.querySelectorAll("[data-heart]")){
  button.setAttribute("aria-pressed","true");
  button.setAttribute("aria-label",t[15]);
 }
}

let returnPosition=0,returnFocus=null;
function renderRoute(){
 const match=location.hash.match(/^#annonce-([0-5])$/);
 const post=match?data[Number(match[1])]:null;
 const panel=q("#post-detail"),feed=q("#storefront");
 const shopMatch=location.hash.match(/^#(?:(commerce)-([0-5])|(fiche)-([0-5])(-fidelite)?)$/);
 const shopPost=shopMatch?data[Number(shopMatch[2]??shopMatch[4])]:null;
 const wasDetail=!panel.hidden;
 const favoritePage=q("#favorites-page");
 const showFavorites=location.hash==="#favoris";
 panel.hidden=!post&&!shopPost;
 favoritePage.hidden=!showFavorites;
 favoriteLink.toggleAttribute("aria-current",showFavorites);
 if(showFavorites)favoriteLink.setAttribute("aria-current","page");
 feed.hidden=!!post||!!shopPost||showFavorites;
 if(showFavorites){
  renderFavorites();
  if(!wasDetail)window.scrollTo(0,0);
  else{window.scrollTo(0,returnPosition);const buttonId=returnFocus?.dataset.open;favoritePage.querySelector('[data-open="'+buttonId+'"]')?.focus({preventScroll:true})}
  return;
 }
 if(shopPost){
  const profile=shopMatch[3]==="fiche";
  const shop=shopPost.shop;
  const shopPosts=data.filter(entry=>entry.shop===shop);
  panel.innerHTML='<a href="#annonce-'+shopPost.id+'" class="detail-back">← '+labels[0]+'</a>'+
   (profile?'<div class="detail-cover"><img src="'+shopPosts[0].src+'" alt=""></div>':'')+
   '<h1 tabindex="-1">'+shop+'</h1>'+
   (profile?renderAddress(shopPost)+renderShopActions(shopPost,true)+renderLoyaltySection(shopPost):'<h2>'+shopActions[2]+'</h2>'+shopPosts.map(entry=>markup(entry,false,false)).join(""));
  window.scrollTo(0,0);
  const loyaltyHeading=shopMatch[5]?panel.querySelector("#loyalty-heading"):null;
  if(loyaltyHeading)loyaltyHeading.focus();
  else panel.querySelector("h1").focus({preventScroll:true});
  return;
 }
 if(!post){
  if(wasDetail){window.scrollTo(0,returnPosition);returnFocus?.focus({preventScroll:true})}
  return;
 }
 const saved=isSaved(post.id);
 panel.innerHTML='<a href="#" class="detail-back">← '+labels[0]+'</a><div class="detail-cover"><img src="'+post.src+'" alt="">'+postTag(post.type)+'</div><div class="detail-copy post-detail-content"><div class="post-detail-heading"><strong>'+post.shop+'</strong>'+(post.id===3?'<span class="sponsored"> · '+t[20]+'</span>':'')+'<h1 tabindex="-1">'+post.title+'</h1><p>'+(post.id===3?'<span class="offer-discount">'+(locale==="fr"?"−20 %":"−20%")+'</span>':'')+post.body+'</p></div>'+renderPostDescription(post)+'<section class="post-merchant-card">'+renderAddress(post)+renderShopActions(post)+renderLoyaltyLink(post)+'</section>'+(post.distance?'<p class="distance">'+icon("walk")+post.distance+' m · '+(aroundMe?aroundLabels[2]:t[21])+'</p>':'')+'<div class="detail-actions post-save-share"><button type="button" class="dialog-heart" data-heart="'+post.id+'" aria-pressed="'+saved+'">'+icon("heart")+' '+t[saved?15:14]+'</button><button type="button" id="share-post">'+labels[1]+'</button></div><p id="share-status" role="status"></p></div>';
 panel.querySelector(".detail-back").onclick=event=>{
  event.preventDefault();
  if(returnFocus)history.back();
  else location.hash="";
 };
 panel.querySelector("#share-post").onclick=async()=>{
  const url=new URL(location.href);
  url.searchParams.delete("demo-account");
  url.searchParams.delete("save");
  const status=panel.querySelector("#share-status");
  try{
   if(navigator.share)await navigator.share({title:post.title,url:url.href});
   else{await navigator.clipboard.writeText(url.href);status.textContent=labels[2]}
  }catch(error){if(error.name!=="AbortError")window.prompt(labels[3],url.href)}
 };
 window.scrollTo(0,0);
 panel.querySelector("h1").focus({preventScroll:true});
}
window.addEventListener("hashchange",renderRoute);
function showCardPhoto(article,id,index){
 const images=cardPhotos(data[id]);
 const selected=Math.max(0,Math.min(images.length-1,index));
 cardPhotoIndex.set(id,selected);
 article.querySelector("[data-card-gallery] img").src=images[selected];
 for(const button of article.querySelectorAll("[data-card-photo]")){
  button.setAttribute("aria-current",String(Number(button.dataset.cardPhoto)===selected));
 }
}
let cardDrag,swipedCard;
document.addEventListener("pointerdown",event=>{
 swipedCard=null;
 cardDrag=null;
 const image=event.target.closest("[data-card-gallery]");
 if(image&&event.isPrimary&&event.button===0)cardDrag={image,pointer:event.pointerId,x:event.clientX,y:event.clientY};
});
document.addEventListener("pointercancel",event=>{
 if(cardDrag?.pointer===event.pointerId)cardDrag=null;
});
document.addEventListener("pointerup",event=>{
 if(cardDrag?.pointer!==event.pointerId)return;
 const {image,x,y}=cardDrag;
 cardDrag=null;
 const delta=event.clientX-x;
 if(Math.abs(delta)<28||Math.abs(delta)<=Math.abs(event.clientY-y))return;
 const id=Number(image.dataset.cardGallery);
 const article=image.closest("article");
 if(!article)return;
 swipedCard=article;
 showCardPhoto(article,id,(cardPhotoIndex.get(id)||0)+(delta<0?1:-1));
});
document.addEventListener("click",event=>{
 const shopLink=event.target.closest(".shop-posts-link");
 if(shopLink){
  returnPosition=window.scrollY;
  returnFocus=shopLink;
  return;
 }
 const dot=event.target.closest("[data-card-photo]");
 if(dot){
  const article=dot.closest("article");
  showCardPhoto(article,Number(article.querySelector("[data-card-gallery]").dataset.cardGallery),Number(dot.dataset.cardPhoto));
  return;
 }
 const open=event.target.closest("[data-open]");
 const heart=event.target.closest("[data-heart]");
 if(open&&event.detail!==0&&open.closest("article")===swipedCard){swipedCard=null;return}
 if(open&&performance.now()>=suppressClickUntil){
  returnPosition=window.scrollY;
  returnFocus=dialog.open?q("#all-store"):open;
  if(dialog.open)dialog.close();
  location.hash="annonce-"+open.dataset.open;
 }
 if(!heart)return;
 const id=Number(heart.dataset.heart);
 if(isExample(id)&&!favorites.includes(id)){
  removedExamples.add(id);
  if(location.hash==="#favoris"){renderFavorites();q("#favorites-title").focus({preventScroll:true})}
  else if(location.hash.startsWith("#annonce-"))renderRoute();
  renderFeed();
  return;
 }
 if(!signed){
  const url=new URL(location.href);
  url.searchParams.set("demo-account","1");url.searchParams.set("save",String(id));
  openDialog(t[16],'<a class="cta" href="'+url.pathname+url.search+url.hash+'">'+t[17]+' · Demo</a>');
  return;
 }
 favorites=favorites.includes(id)?favorites.filter(value=>value!==id):[...favorites,id];
 saveFavorites();
 if(examples&&!favorites.includes(id))removedExamples.add(id);
 if(location.hash==="#favoris"){
  renderFavorites();
  q("#favorites-title").focus({preventScroll:true});
 }
 document.querySelectorAll('[data-heart="'+id+'"]').forEach(button=>{
  const saved=favorites.includes(id);
  button.setAttribute("aria-pressed",String(saved));
  button.setAttribute("aria-label",t[saved?15:14]);
  if(button.classList.contains("dialog-heart"))button.innerHTML=icon("heart")+" "+t[saved?15:14];
 });
});
function saveFavorites(){try{sessionStorage.setItem(favoriteKey,JSON.stringify(favorites))}catch{}}
const returnUrl=new URL(location.href);
const savedPost=returnUrl.searchParams.get("save");
if(signed&&savedPost!==null&&data[Number(savedPost)]){
 const id=Number(savedPost);
 favorites=[...new Set([...favorites,id])];saveFavorites();
 const button=q('[data-heart="'+id+'"]');
 if(button){button.setAttribute("aria-pressed","true");button.setAttribute("aria-label",t[15]);if(track.children[id])track.scrollLeft=track.children[id].offsetLeft-track.children[0].offsetLeft}
 returnUrl.searchParams.delete("save");history.replaceState(null,"",returnUrl);
}
q("#all-store").onclick=()=>openDialog("Doe-het-zelf",data.slice(0,3).map(post=>markup(post,false).replace(/<span class="distance"[^>]*>[\s\S]*?<\/span>/,"")).join(""));
renderFeed();
renderRoute();
</script><script src="buuurt-theme.js"></script><script src="buuurt-review-tools.js"></script><script src="buuurt-shared-header.js"></script></body></html>
