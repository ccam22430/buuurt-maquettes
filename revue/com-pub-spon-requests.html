<main class="body requests-page">

<h1 id="request-title"></h1>

<section id="request-list" hidden>

<section id="request-detail" hidden>

<button type="button" id="fullscreen" data-t="fullscreen" aria-pressed="false"></button>

<ul class="campaign-legend">

<li data-band="other" data-t="other"></li>

</section>

</fieldset>
<label for="request-reply" data-t="response"></label>

</form>
</section>
