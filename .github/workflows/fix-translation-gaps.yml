name: Correct multilingual labels across BUUURT mockups
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-translation-gaps.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix missing translations
        run: python scripts/fix_translation_gaps.py
      - name: Verify and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUUURT_Bibliotheque_Visuelle_20_Ecrans_Menu_NL.html
          git diff --cached --quiet || (git commit -m "Fix untranslated multilingual mockup labels" && git push)
