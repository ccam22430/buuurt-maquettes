name: Verify modular BUUURT screens
on:
  push:
    branches: ['refactor/modular-20-screens-20261121']
    paths: ['.github/workflows/verify-modular.yml', 'modular/**', 'tests/verify-modular.cjs']
  pull_request:
    paths: ['modular/**', 'tests/verify-modular.cjs']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact 20-screen extraction
        run: node tests/verify-modular.cjs
