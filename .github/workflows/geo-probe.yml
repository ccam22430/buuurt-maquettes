name: GEO network qualification
on:
  push:
    branches: [lab/geo-v1-20261127]
    paths: ['.github/workflows/geo-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate official PDOK response
        run: |
          python3 - <<'PY'
          import urllib.request, json
          url = 'https://api.pdok.nl/cbs/wijken-en-buurten-2025/ogc/v1/collections/buurten/items?bbox=4.83,52.35,4.89,52.39&limit=10&f=json'
          with urllib.request.urlopen(url, timeout=25) as response:
              data = json.load(response)
          features = data['features']
          assert features and all(f['geometry']['type'] in ('Polygon','MultiPolygon') for f in features)
          print('PDOK polygons:', len(features))
          assert all(f['properties'].get('buurtcode') and f['properties'].get('buurtnaam') and str(f['properties'].get('jaar')) == '2025' for f in features)
          print('Neighbourhoods:', [(f['properties']['buurtcode'], f['properties']['buurtnaam']) for f in features])
          print('Pagination:', [l.get('rel') for l in data.get('links',[])])
          PY
