name: Apply black notification icon HAB-SIT-001
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-hab-sit-001-black-bell.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch targeted icon and validate
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='BUUURT_Bibliotheque_Visuelle_20_Ecrans_Menu_NL.html';
          const original=fs.readFileSync(file,'utf8');
          const start=original.indexOf('"fr": "HAB-SIT-001"');
          const end=original.indexOf('"}, {"fr":',start+30);
          if(start<0||end<0)throw Error('HAB-SIT-001 boundaries not found');
          const page=original.slice(start,end);
          const icon="<span aria-label='3 ongelezen meldingen' title='3 ongelezen meldingen' style='display:inline-flex;position:relative;align-items:center;justify-content:center;width:27px;height:27px;border:1.5px solid #111;border-radius:50%;background:#fff;color:#111;vertical-align:middle'><svg xmlns='http://www.w3.org/2000/svg' width='17' height='17' viewBox='0 0 24 24' fill='none' stroke='#111' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9'/><path d='M10 21h4'/></svg><span style='position:absolute;top:-7px;right:-8px;min-width:15px;height:15px;padding:0 2px;border-radius:10px;background:#111;color:#fff;font:700 10px/15px Arial,sans-serif;text-align:center'>3</span></span>";
          if(page.includes("aria-label='3 ongelezen meldingen'")){console.log('Already patched');process.exit(0);}
          const old='◎ NL⌄  🔔';
          if(page.split(old).length!==2)throw Error('Expected exactly one notification emoji in HAB-SIT-001');
          const updated=original.slice(0,start)+page.replace(old,'◎ NL⌄  '+icon)+original.slice(end);
          if(updated.slice(0,start)!==original.slice(0,start)||updated.slice(start+page.length-old.length+('◎ NL⌄  '+icon).length)!==original.slice(end))throw Error('Unexpected change outside page');
          fs.writeFileSync(file,updated);
          console.log('PASS: only HAB-SIT-001 header icon replaced');
          NODE
      - name: Commit change
        run: |
          if git diff --quiet -- BUUURT_Bibliotheque_Visuelle_20_Ecrans_Menu_NL.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUUURT_Bibliotheque_Visuelle_20_Ecrans_Menu_NL.html
          git commit -m 'fix: black outlined bell and notification count on HAB-SIT-001'
          git push
