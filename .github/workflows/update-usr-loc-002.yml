name: Apply approved USR-LOC-002 mockup correction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-usr-loc-002.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate update
        run: python scripts/update_usr_loc_002.py
      - name: Commit approved HTML correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUUURT_Bibliotheque_Visuelle_20_Ecrans_Menu_NL.html
          git diff --cached --quiet || (git commit -m "Update USR-LOC-002 multilingual arrival message" && git push)
