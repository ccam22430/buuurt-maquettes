name: Apply approved multilingual mockup update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/translate-all-maquettes.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply translation and cashier update
        run: python scripts/translate_all_20_and_add_cashier_ad.py
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUUURT_Bibliotheque_Visuelle_20_Ecrans_Menu_NL.html
          git diff --cached --quiet || (git commit -m "Add FR NL EN language selector and third cashier announcement" && git push)
